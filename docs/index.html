<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeQuest · quests that verify themselves</title>
<meta name="description" content="A Gno.land quest board where every quest is checked by public code. Do it, tap Check me, get GNOT and a numbered soulbound card.">
<link rel="icon" href="art/emblem.png">
<meta property="og:title" content="MeQuest · quests that verify themselves">
<meta property="og:image" content="art/emblem.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F4}
a{color:#8A6A2F}a:hover{color:#74572A}
@keyframes mqShine{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes mqTicker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes mqLine{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes mqBlink{50%{opacity:0}}
@keyframes mqBlobA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.12)}}
@keyframes mqBlobB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,50px) scale(1.15)}}
@keyframes mqPulse{0%{box-shadow:0 0 0 0 rgba(21,128,61,.45)}70%{box-shadow:0 0 0 8px rgba(21,128,61,0)}100%{box-shadow:0 0 0 0 rgba(21,128,61,0)}}
@keyframes mqAmber{0%{box-shadow:0 0 0 0 rgba(167,131,74,.5)}70%{box-shadow:0 0 0 8px rgba(167,131,74,0)}100%{box-shadow:0 0 0 0 rgba(167,131,74,0)}}
@keyframes mqFlip{0%{opacity:0;transform:perspective(900px) rotateY(100deg) scale(.6)}60%{opacity:1;transform:perspective(900px) rotateY(-10deg) scale(1.05)}100%{transform:perspective(900px) rotateY(0) scale(1)}}
@keyframes mqSpin{to{transform:rotate(360deg)}}
.mq-holo{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,rgba(124,58,237,.18) 52%,rgba(37,99,235,.18) 58%,transparent 72%);background-size:200% 100%;animation:mqShine 3.5s linear infinite}
.mq-ticker{animation:mqTicker 40s linear infinite}
.mq-line{animation:mqLine .25s ease-out both}
.mq-cursor{animation:mqBlink 1s step-end infinite}
.mq-blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
.mq-a{animation:mqBlobA 18s ease-in-out infinite}.mq-b{animation:mqBlobB 22s ease-in-out infinite}
.mq-dot-g{display:inline-block;width:8px;height:8px;border-radius:50%;background:#15803D;animation:mqPulse 2s ease-out infinite}
.mq-dot-a{display:inline-block;width:8px;height:8px;border-radius:50%;background:#A7834A;animation:mqAmber 2s ease-out infinite}
.mq-spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#C6A66B;animation:mqSpin .8s linear infinite}
.mq-flip{animation:mqFlip .9s cubic-bezier(.2,.8,.2,1) both}
.app{display:flex;flex-wrap:wrap;align-items:flex-start;min-height:100vh;position:relative}
.side{flex:0 0 256px;box-sizing:border-box;min-height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,#111111,#1A1814 60%,#111111);color:#EDE7DC;box-shadow:inset -1px 0 0 rgba(198,166,107,.25)}
.side .nav{color:#CFC7B8}.side .nav:hover{background:#252525;color:#FFFFFF}.side .nav-on,.side .nav-on:hover{background:#C6A66B;color:#111111}.side .cnt{background:#252525;color:#CFC7B8}.side .nav-on .cnt{background:rgba(17,17,17,.15);color:#111111}.side .cnt-a{background:rgba(198,166,107,.2);color:#E6CE9F}
.main{flex:999 1 560px;min-width:0;box-sizing:border-box;padding:28px clamp(16px,3.5vw,44px) 64px;display:flex;flex-direction:column;gap:28px}
.topbar{display:none;flex:1 1 100%;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:#111111;color:#FFFFFF;box-shadow:inset 0 -1px 0 rgba(198,166,107,.3)}
.mobilemenu{flex:1 1 100%;padding:10px 16px 16px;display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.92);border-bottom:1px solid rgba(227,216,199,.7)}
@media (max-width:860px){.side{display:none}.topbar{display:flex}.main{padding-top:20px}}
@media (min-width:861px){.mobilemenu{display:none}}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;font:500 14px Inter,sans-serif;color:#4A443D;cursor:pointer;text-align:left}
.nav:hover{background:rgba(244,238,228,.9)}
.nav-on,.nav-on:hover{background:#111111;color:#FAF8F4}
.nav svg{flex-shrink:0}
.nav-l{flex:1}
.cnt{font:600 11px 'JetBrains Mono',monospace;padding:2px 7px;border-radius:999px;background:#F1ECE4;color:#4A443D}
.nav-on .cnt{background:#3A342D;color:#C6A66B}
.cnt-a{background:#F3EBDD;color:#74572A}
.panel{background:rgba(255,255,255,.88);border:1px solid rgba(227,216,199,.9);border-radius:20px;box-shadow:0 10px 30px rgba(120,90,40,.07)}
.eyebrow{margin:0;font:600 12px 'JetBrains Mono',monospace;letter-spacing:.08em;color:#6B645B;text-transform:uppercase}
.h1{margin:4px 0 0;font:800 clamp(30px,4.4vw,46px)/1.05 Montserrat,sans-serif;letter-spacing:-.025em}
.h2{margin:0;font:800 22px/1.15 Montserrat,sans-serif;letter-spacing:-.01em}
.lede{margin:8px 0 0;font-size:16px;line-height:1.55;color:#4A443D;max-width:640px}
.muted{color:#6B645B}
.mono{font-family:'JetBrains Mono',monospace}
.btn{min-height:46px;padding:0 18px;border-radius:13px;border:0;font:700 14px Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-dark{background:#111111;color:#FAF8F4}.btn-dark:hover{background:#000;color:#FAF8F4}
.btn-gold{background:#C6A66B;color:#111111}.btn-gold:hover{background:#B8955A;color:#111111}
.btn-green{background:#15803D;color:#FFFFFF}
.btn-ghost{background:rgba(255,255,255,.9);color:#111111;border:1px solid #E3D9CB}
.btn-red{background:#FDECEC;color:#B91C1C;border:1px solid #F7C9C9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 11px 'JetBrains Mono',monospace;padding:4px 9px;border-radius:999px}
.track{height:10px;border-radius:999px;background:#EFE7DA;box-shadow:inset 0 1px 2px rgba(60,40,10,.12);overflow:hidden}
.mq-bar{position:relative;height:100%;border-radius:999px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.mq-bar::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);background-size:200% 100%;animation:mqShine 2.2s linear infinite}
.term{background:#111111;color:#EDE6DA;border-radius:16px;padding:14px 16px;font:12.5px/1.75 'JetBrains Mono',monospace;overflow:hidden}
.grid{display:grid;gap:14px}
.qcard{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:20px;background:rgba(255,255,255,.9);border:1px solid rgba(227,216,199,.9);box-shadow:0 10px 30px rgba(120,90,40,.07);cursor:pointer;text-align:left;font:inherit;color:#111111;transition:transform .2s ease,box-shadow .2s ease}
.qcard:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(120,90,40,.12)}
.qcard:focus-visible,.nav:focus-visible,.btn:focus-visible,.mqk:focus-visible{outline:3px solid #8A6A2F;outline-offset:2px}
.stat{background:rgba(255,255,255,.82);padding:16px 18px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mqk{position:relative;overflow:hidden;aspect-ratio:5/7;border-radius:16px;padding:10px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;background:#FFFFFF;border:2px solid #A8A29E;font:inherit;color:#111111;transition:transform .2s ease}
button.mqk{cursor:pointer;appearance:none;-webkit-appearance:none}
button.mqk:hover{transform:translateY(-4px) rotate(-1deg)}
.mqk-r{position:relative;align-self:flex-start;font:600 10px 'JetBrains Mono',monospace;letter-spacing:.04em}
.mqk-i{position:relative;width:76%;aspect-ratio:1;object-fit:contain}
.mqk-n{position:relative;font:800 15px/1.1 Montserrat,sans-serif}
.mqk-h{position:relative;font-size:11px;line-height:1.3;color:#4A443D}
.mqk-c{background:linear-gradient(160deg,#F4F1EC,#FFFFFF);border-color:#A8A29E;box-shadow:0 10px 24px rgba(168,162,158,.22)}.mqk-c .mqk-r{color:#57534E}
.mqk-r2{background:linear-gradient(160deg,#EAF1FE,#FFFFFF);border-color:#2563EB;box-shadow:0 10px 24px rgba(37,99,235,.18)}.mqk-r2 .mqk-r{color:#1D4ED8}
.mqk-e{background:linear-gradient(160deg,#F1EAFE,#FFFFFF);border-color:#7C3AED;box-shadow:0 10px 24px rgba(124,58,237,.18)}.mqk-e .mqk-r{color:#6D28D9}
.mqk-l{background:linear-gradient(160deg,#F3EBDD,#FFF8EA);border-color:#B8955A;box-shadow:0 12px 30px rgba(217,142,30,.3)}.mqk-l .mqk-r{color:#74572A}
.mqk-lock{filter:grayscale(1);opacity:.45;box-shadow:none}
.tab{min-height:42px;padding:0 15px;border-radius:999px;font:600 13px Inter,sans-serif;cursor:pointer;border:1px solid #E3D9CB;background:rgba(255,255,255,.9);color:#111111}
.tab-on{border-color:#111111;background:#111111;color:#FAF8F4}
.field{min-height:46px;padding:0 14px;border-radius:12px;border:1px solid #D9CFC0;background:#FFFFFF;font:15px Inter,sans-serif;color:#111111;width:100%;box-sizing:border-box}
.lbl{font-size:13px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px}
.rule{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.75);border:1px solid rgba(227,216,199,.9);font-size:13px;line-height:1.45;color:#4A443D}
.rule strong{color:#111111}
.rule-i{flex-shrink:0;min-width:34px;height:34px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:#111111;color:#C6A66B;display:flex;align-items:center;justify-content:center;font:700 12px 'JetBrains Mono',monospace}
@media (prefers-reduced-motion:reduce){.mq-holo,.mq-ticker,.mq-line,.mq-cursor,.mq-a,.mq-b,.mq-dot-g,.mq-dot-a,.mq-spin,.mq-flip,.mq-bar::after{animation:none}.mq-bar,.qcard,.mqk{transition:none}}

.mq-holo-e{background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 45%,rgba(124,58,237,.22) 55%,transparent 72%);background-size:200% 100%;animation:mqShine 4.5s linear infinite}
.mqk-r2{box-shadow:0 10px 24px rgba(37,99,235,.18),0 0 0 1px rgba(37,99,235,.15),0 0 18px rgba(37,99,235,.18)}
.mqk-lock{filter:none;opacity:1;box-shadow:none;background:#EEEAE3;border-color:#CFC6B8;border-style:dashed}
.mqk-lock .mqk-i{filter:brightness(0) opacity(.18)}
.mqk-lock .mqk-n,.mqk-lock .mqk-r{color:#8C8478}
button.chip{border:0;cursor:pointer}
.side{position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow-y:auto}
dl dd{overflow-wrap:anywhere}
</style>

</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="min-height: 100vh; position: relative; overflow: hidden; background: #FAF8F4; color: #111111; font-family: Inter, system-ui, sans-serif">
<div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none">
<div class="mq-blob mq-a" style="width: 520px; height: 520px; top: -140px; right: 2%; background: rgba(198,166,107,.38)"></div>
<div class="mq-blob mq-b" style="width: 460px; height: 460px; top: 220px; right: 30%; background: rgba(196,181,253,.36)"></div>
<div class="mq-blob mq-a" style="width: 480px; height: 480px; top: 1100px; left: 10%; background: rgba(253,186,140,.26)"></div>
<div class="mq-blob mq-b" style="width: 520px; height: 520px; top: 1900px; right: 0; background: rgba(147,197,253,.22)"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(#E3D8C7 1px, transparent 1.3px); background-size: 22px 22px; -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.3) 40%, rgba(0,0,0,.5) 80%, rgba(0,0,0,.25)); mask-image: linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.3) 40%, rgba(0,0,0,.5) 80%, rgba(0,0,0,.25))"></div>

<div class="app">

<div class="topbar">
<button type="button" class="btn" onClick="{{ toggleMenu }}" aria-label="{{ menuLabel }}" style="min-width: 46px; padding: 0 12px; background: #252525; color: #FFFFFF">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>
<span style="display: flex; align-items: center; gap: 8px; font: 800 20px Montserrat, sans-serif; color: #FFFFFF"><img src="art/emblem.png" alt="" style="width: 34px; height: 34px; object-fit: contain"><span>Me<span style="color: #C6A66B">Q</span>uest</span></span>
<button type="button" class="chip" onClick="{{ walletAction }}" style="{{ wallet.chipStyle }}"><span class="{{ wallet.dot }}"></span>{{ wallet.chip }}</button>
</div>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<nav class="mobilemenu" aria-label="Main menu">
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="9">
<button type="button" class="{{ n.cls }}" onClick="{{ n.go }}" aria-current="{{ n.current }}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ n.icon }}"></path></svg>
<span class="nav-l">{{ n.label }}</span>
<sc-if value="{{ n.hasCount }}" hint-placeholder-val="{{ false }}"><span class="{{ n.cntCls }}">{{ n.count }}</span></sc-if>
</button>
</sc-for>
</nav>
</sc-if>

<aside class="side" aria-label="Sidebar">
<button type="button" onClick="{{ goHome }}" aria-label="MeQuest home" style="display: flex; align-items: center; gap: 10px; padding: 4px 6px; border: 0; background: transparent; cursor: pointer; text-align: left">
<img src="art/emblem.png" alt="" style="width: 46px; height: 46px; object-fit: contain">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font: 800 23px Montserrat, sans-serif; letter-spacing: -.02em; color: #FFFFFF">Me<span style="color: #C6A66B">Q</span>uest</span>
<span style="font: 600 8.5px Montserrat, sans-serif; letter-spacing: .22em; color: #A99F8E">DISCOVERY · IDENTITY · EXPLORATION</span>
</span>
</button>
<div style="height: 1px; background: linear-gradient(90deg, rgba(198,166,107,0), rgba(198,166,107,.5), rgba(198,166,107,0))"></div>
<button type="button" onClick="{{ walletAction }}" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #1F1D1A; border: 1px solid rgba(198,166,107,.25); width: 100%; text-align: left; cursor: pointer; font: inherit">
<span style="width: 34px; height: 34px; border-radius: 50%; background: #C6A66B; color: #111111; display: flex; align-items: center; justify-content: center; font: 800 14px Montserrat, sans-serif">{{ me.initial }}</span>
<div style="min-width: 0">
<p style="margin: 0; font-weight: 700; font-size: 14px; color: #FFFFFF">{{ me.display }}</p>
<p class="mono" style="margin: 0; font-size: 11px; color: #A99F8E"><span class="{{ wallet.dot }}"></span> {{ me.line }}</p>
</div>
</button>
<nav aria-label="Main menu" style="display: flex; flex-direction: column; gap: 3px">
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="9">
<button type="button" class="{{ n.cls }}" onClick="{{ n.go }}" aria-current="{{ n.current }}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ n.icon }}"></path></svg>
<span class="nav-l">{{ n.label }}</span>
<sc-if value="{{ n.hasCount }}" hint-placeholder-val="{{ false }}"><span class="{{ n.cntCls }}">{{ n.count }}</span></sc-if>
</button>
</sc-for>
</nav>
<div style="margin-top: 6px; padding: 14px; border-radius: 16px; background: linear-gradient(160deg, rgba(198,166,107,.22), rgba(198,166,107,.05)); border: 1px solid rgba(198,166,107,.35); color: #FAF8F4; display: flex; flex-direction: column; gap: 8px">
<p class="mono" style="margin: 0; font-size: 11px; letter-spacing: .08em; color: #C6A66B">SEASON 1 ENDS IN</p>
<p style="margin: 0; font: 800 22px Montserrat, sans-serif">{{ countdown }}</p>
<p style="margin: 0; font-size: 12px; color: #D8CFC2">You're <strong style="color: #C6A66B">#{{ myRank }}</strong> · {{ ownedCount }} cards</p>
</div>
<div style="padding: 12px 14px; border-radius: 16px; background: #1F1D1A; border: 1px solid rgba(198,166,107,.2); display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 12px"><span style="color: #A99F8E">Claims today</span><strong style="color: #FFFFFF">{{ claimsToday }} / 10</strong></div>
<div class="track" style="height: 7px; background: #2E2B26; box-shadow: none"><div class="mq-bar" style="{{ capBar }}"></div></div>
</div>
</aside>

<main class="main">
<sc-if value="{{ toast.show }}" hint-placeholder-val="{{ false }}"><div role="status" aria-live="polite" style="{{ toast.style }}"><span style="flex: 1">{{ toast.text }}</span><sc-if value="{{ toast.hasAction }}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-dark" onClick="{{ toast.action }}" style="min-height: 36px">{{ toast.actionLabel }}</button></sc-if><button type="button" onClick="{{ toast.close }}" aria-label="Dismiss" style="border: 0; background: transparent; font: 700 18px Inter, sans-serif; cursor: pointer; color: inherit; min-width: 32px; min-height: 32px">×</button></div></sc-if>

<!-- ================= HOME ================= -->
<sc-if value="{{ pg.home }}" hint-placeholder-val="{{ true }}">
<section style="display: flex; flex-wrap: wrap; gap: 28px; align-items: center">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span class="chip" style="background: #E8F3EA; color: #166534; border: 1px solid #B9DCC1"><span class="mq-dot-g"></span>live on the onyx-1 testnet</span>
<span class="chip" style="background: #F3EBDD; color: #74572A; border: 1px solid #E2D2B5">Season 1 · {{ countdown }} left</span>
<span class="chip" style="background: #111111; color: #C6A66B; letter-spacing: .14em">DISCOVERY · IDENTITY · EXPLORATION</span>
</div>
<h1 style="margin: 0; font: 800 clamp(42px, 6vw, 70px)/.98 Montserrat, sans-serif; letter-spacing: -.035em">Quests that<br><span style="color: #8A6A2F">verify themselves.</span></h1>
<p class="lede" style="font-size: 18px">Every quest is paid by public Gno code. Do it, tap Check me, get GNOT and a numbered badge card. No screenshots, no trust, no waiting on a mod.</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" class="btn btn-dark" onClick="{{ goQuests }}" style="min-height: 52px; padding: 0 24px">Browse quests</button>
<button type="button" class="btn btn-ghost" onClick="{{ goCases }}" style="min-height: 52px; padding: 0 24px">Try to cheat it</button>
</div>
</div>
<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 12px; align-items: center">
<div style="position: relative; width: 100%; max-width: 380px; height: 260px">
<img src="art/emblem.png" alt="" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; transform: translate(-50%, -50%); opacity: .16; filter: blur(.5px)">
<div class="mqk mqk-r2" style="position: absolute; left: 0; top: 30px; width: 150px; transform: rotate(-10deg)"><span class="mqk-r">RARE</span><img class="mqk-i" src="{{ art.realm }}" alt=""><span class="mqk-n">First Realm</span></div>
<div class="mqk mqk-e" style="position: absolute; right: 0; top: 30px; width: 150px; transform: rotate(10deg)"><span class="mq-holo mq-holo-e"></span><span class="mqk-r">EPIC</span><img class="mqk-i" src="{{ art.builder }}" alt=""><span class="mqk-n">Realm Builder</span></div>
<div class="mqk mqk-l" style="position: absolute; left: 50%; top: 0; width: 170px; transform: translateX(-50%)"><span class="mq-holo"></span><span class="mqk-r">LEGENDARY</span><img class="mqk-i" src="{{ art.champ }}" alt=""><span class="mqk-n">Season Champion</span></div>
</div>
<div role="img" aria-label="Proof log replay" class="term" style="width: 100%; max-width: 420px; height: 150px; box-sizing: border-box">
<sc-for list="{{ heroLines }}" as="l" hint-placeholder-count="2"><div class="mq-line" style="{{ l.style }}">{{ l.text }}</div></sc-for>
<span class="mq-cursor" style="color: #A79E91">_</span>
</div>
</div>
</section>

<section aria-label="On-chain numbers" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: rgba(227,216,199,.7); border: 1px solid rgba(227,216,199,.9); border-radius: 22px; overflow: hidden; box-shadow: 0 24px 60px rgba(120,90,40,.10)">
<sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
<div class="stat">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><span class="eyebrow" style="font-size: 11px">{{ s.label }}</span><span style="{{ s.dotStyle }}"></span></div>

<div style="flex: 1 1 210px; display: flex; justify-content: center"><div class="{{ sel.cls }}" style="width: 210px; flex: none"><sc-if value="{{ sel.holo }}" hint-placeholder-val="{{ false }}"><span class="{{ sel.holoCls }}"></span></sc-if><span class="mqk-r">{{ sel.tag }}</span><img class="mqk-i" src="{{ sel.img }}" alt=""><span class="mqk-n" style="font-size: 18px">{{ sel.name }}</span><span class="mqk-h">{{ sel.owner }}</span></div></div>
<div style="flex: 999 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div><span class="chip" style="{{ sel.chipStyle }}">{{ sel.rarity }}</span> <span class="chip" style="{{ sel.ownStyle }}">{{ sel.ownLabel }}</span><h3 style="margin: 8px 0 4px; font: 800 30px/1.1 Montserrat, sans-serif">{{ sel.name }}</h3><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4A443D">{{ sel.story }}</p></div>
<div class="grid" style="grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><div class="panel" style="padding: 12px"><span class="mono muted" style="font-size: 10px">REWARD</span><br><strong style="font: 800 20px Montserrat, sans-serif; color: #8A6A2F">{{ sel.reward }} GNOT</strong></div><div class="panel" style="padding: 12px"><span class="mono muted" style="font-size: 10px">MINTED</span><br><strong style="font: 800 20px Montserrat, sans-serif">{{ sel.minted }}</strong> <span class="muted" style="font-size: 13px">/ {{ sel.max }}</span></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div class="track"><div class="mq-bar" style="{{ sel.barStyle }}"></div></div><span style="font-size: 12px; color: #4A443D">{{ sel.leftLabel }}</span></div>
<sc-if value="{{ sel.own }}" hint-placeholder-val="{{ false }}"><p class="chip" style="margin: 0; align-self: flex-start; background: #E8F3EA; color: #166534; padding: 6px 10px">✓ verified on-chain · {{ sel.proof }}</p></sc-if>
<div><p class="eyebrow" style="font-size: 11px; margin-bottom: 6px">How to earn</p><strong>{{ sel.how }}</strong></div>
<sc-if value="{{ sel.hasQuest }}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-dark" onClick="{{ sel.go }}" style="align-self: flex-start">Go to the quest</button></sc-if>
<div><p class="eyebrow" style="font-size: 11px; margin-bottom: 6px">The code that pays it</p><code class="term" style="display: block; white-space: pre-wrap; color: #86EFAC; font-size: 13px">{{ sel.check }}</code></div>
</div>
</div>
</div>
</sc-if>

<!-- ================= REVEAL MODAL ================= -->
<sc-if value="{{ revealOpen }}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-label="New card" style="position: fixed; inset: 0; z-index: 60; background: rgba(28,26,23,.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 16px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 18px; position: relative">
<div aria-hidden="true" style="position: absolute; top: -50px; width: 440px; height: 440px; border-radius: 50%; background: radial-gradient(circle, rgba(198,166,107,.5), transparent 65%)"></div>
<p class="mono" style="position: relative; margin: 0; color: #C6A66B; letter-spacing: .12em; font-size: 13px">NEW CARD · {{ rev.rarityUp }}</p>
<div class="mq-flip" style="position: relative"><div class="{{ rev.cls }}" style="width: 230px"><sc-if value="{{ rev.holo }}" hint-placeholder-val="{{ false }}"><span class="{{ rev.holoCls }}"></span></sc-if><span class="mqk-r">{{ rev.tag }}</span><img class="mqk-i" src="{{ rev.img }}" alt=""><span class="mqk-n" style="font-size: 20px">{{ rev.name }}</span><span class="mqk-h">{{ rev.owner }}</span></div></div>
<p style="position: relative; margin: 0; color: #FAF8F4; font-size: 16px">+{{ rev.reward }} GNOT sent to your wallet</p>
<div style="position: relative; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center"><button type="button" class="btn btn-gold" onClick="{{ revealToPassport }}" style="min-height: 50px">Put it in my binder</button><button type="button" class="btn btn-ghost" onClick="{{ revealClose }}" style="min-height: 50px">Keep questing</button></div>
</div>
</div>
</sc-if>
</div>

</template>
<script src="config.js"></script>
<script src="js/morphdom.min.js"></script>
<script src="js/runtime.js"></script>
<script src="js/chain.js"></script>
<script src="js/logic.js"></script>
<script>MQ.mount(document.getElementById('root'), document.getElementById('tpl'), MeQuestApp);</script>
</body>
</html>
